name: Upstream Sync

permissions:
  contents: write
  actions: write
  issues: write

on:
  schedule:
    - cron: "0 0 * * *" # every day
  workflow_dispatch:
    inputs:
      confirm_breaking_update:
        description: "I have reviewed any compatibility update notice and agree to apply it if present / 我已阅读可能存在的兼容性更新公告，并同意在有此类更新时应用"
        required: true
        default: false
        type: boolean

concurrency:
  group: upstream-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Check sync token
        env:
          SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if [[ -z "${SYNC_TOKEN}" ]]; then
            echo "::warning title=UPSTREAM_SYNC_TOKEN 未配置::当前使用 GITHUB_TOKEN 同步。若上游改动了 .github/workflows/ 下的文件，GitHub 会拒绝推送（refusing to allow a GitHub App to create or update workflow ... without 'workflows' permission）。请在仓库 Settings > Secrets and variables > Actions 中配置 UPSTREAM_SYNC_TOKEN（细粒度 PAT，需 Contents: Read and write + Workflows: Read and write；经典 PAT 需 repo + workflow）。"
          else
            echo "UPSTREAM_SYNC_TOKEN 已配置，同步将使用该 PAT 推送。"
          fi

      - name: Check breaking update policy
        id: breaking_guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REPO: MarSeventh/CloudFlare-ImgBed
          UPSTREAM_BRANCH: main
          ALLOW_BREAKING_UPDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_breaking_update == true }}
        run: bash .github/breaking-updates/scripts/breaking-update-guard.sh check

      - name: Sync upstream changes
        id: sync
        if: steps.breaking_guard.outputs.blocked != 'true'
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_sync_repo: MarSeventh/CloudFlare-ImgBed
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.UPSTREAM_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          test_mode: false

      - name: Complete breaking update notices
        if: steps.sync.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/breaking-updates/scripts/breaking-update-guard.sh complete

      - name: Trigger Worker deploy
        if: steps.sync.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-worker.yml --repo "${{ github.repository }}" --ref main

      - name: Sync failure guidance
        if: failure() && steps.sync.outcome == 'failure'
        run: |
          {
            echo "## ⚠️ 上游同步未完成 / Upstream synchronization did not complete"
            echo
            echo "上游同步步骤未能完成。若上游近期修改了 workflow 文件，GitHub 可能会暂停包含 workflow 变更的自动同步；也可能是当前 Fork 的 Actions 权限或同步权限发生了变化。"
            echo
            echo "The upstream synchronization step could not be completed. If the upstream workflow files changed recently, GitHub may pause automatic synchronization that includes workflow changes. The issue may also be related to Actions or synchronization permissions in this fork."
            echo
            echo "常见原因：`UPSTREAM_SYNC_TOKEN` 未配置或已过期，导致推送包含 workflow 文件变更的提交时被 GitHub 拒绝（GitHub App token 缺少 workflows 权限）。请在 Settings > Secrets and variables > Actions 中配置具备 Contents + Workflows 读写权限的个人访问令牌，然后重新运行本工作流。"
            echo
            echo "Common cause: `UPSTREAM_SYNC_TOKEN` is missing or expired, so GitHub rejects the push when it contains workflow file changes (the GitHub App token lacks workflows permission). Configure a personal access token with Contents and Workflows read/write in Settings > Secrets and variables > Actions, then rerun this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "[Error] 上游同步未能完成。请检查 UPSTREAM_SYNC_TOKEN 是否存在且具备 Contents + Workflows 读写权限后再重跑。"
          echo "[Error] The upstream sync could not be completed. If the upstream workflow files changed recently, manually run Sync Fork on GitHub and then rerun this workflow."
          exit 1
